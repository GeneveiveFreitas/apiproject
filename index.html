<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Palette Converter</h1>

    <input type="file" id="FileInput" accept="image/*">
    <button type="button" id="Button">Go</button>
    <pre id="Result" role="status" aria-live="polite"></pre>

    <div id="colorOverlay" class="overlay">
  <div class="overlay-content">
    <button id="closeOverlay" class="close-btn">&times;</button>
    <div id="overlayColor" class="overlay-color"></div>
    <h2 id="overlayName"></h2>
    <p id="overlayCode"></p>
  </div>
</div>

    <script src="script.js"></script>
</body>
</html>
